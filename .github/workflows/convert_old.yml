name: Convert APP.xlsx to JSON

on:
  push:
    branches: [ main ]
    paths:
      - 'APP.xlsx'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Convert Excel to JSON
        run: python scripts/xlsx_to_json.py APP.xlsx .

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checks.json parties.json salaries.json overdue.json lastPrices.json allSales.json dataUpdatedAt.json
          git diff --cached --quiet || git commit -m "Auto-update JSON from APP.xlsx"
          git push
