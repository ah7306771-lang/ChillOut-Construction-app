name: Daily Backup

on:
  schedule:
    - cron: '0 0 * * *'  # 00:00 UTC = 03:00 Cairo time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare backup folder
        id: prep
        run: |
          DATE=$(TZ='Africa/Cairo' date +'%Y-%m-%d')
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          mkdir -p "backups/$DATE"

      - name: Copy data files
        run: |
          DATE="${{ steps.prep.outputs.date }}"
          DEST="backups/$DATE"

          shopt -s nullglob
          for f in *.json; do
            cp -f "$f" "$DEST/"
          done

          [ -f "APP.xlsx" ] && cp -f "APP.xlsx" "$DEST/APP.xlsx" || true
          [ -f "index.html" ] && cp -f "index.html" "$DEST/index.html" || true

          for f in manifest.json service-worker.js sw.js firebase-messaging-sw.js; do
            [ -f "$f" ] && cp -f "$f" "$DEST/" || true
          done

          [ -d "scripts" ] && cp -rf scripts "$DEST/scripts" || true

          # Include latest Google Sheet dump + Apps Script snapshot
          # (written by the Apps Script daily trigger to backups/latest/)
          if [ -d "backups/latest" ]; then
            cp -rf backups/latest/. "$DEST/"
          fi

      - name: Write backup manifest
        run: |
          DATE="${{ steps.prep.outputs.date }}"
          DEST="backups/$DATE"
          {
            echo "# Backup — $DATE"
            echo ""
            echo "Auto-generated by daily-backup.yml"
            echo ""
            echo "## Source commit"
            git log -1 --pretty=format:'%H%n%an <%ae>%n%ad%n%s'
            echo ""
            echo "## Files in snapshot"
            (cd "$DEST" && find . -type f | LC_ALL=C sort)
          } > "$DEST/README.md"

      - name: Retention — delete backups older than 30 days
        run: |
          if [ -d backups ]; then
            CUTOFF=$(date -u -d '30 days ago' +'%Y-%m-%d')
            for dir in backups/20*-*-*; do
              [ -d "$dir" ] || continue
              folder_date=$(basename "$dir")
              if [[ "$folder_date" < "$CUTOFF" ]]; then
                echo "Removing old backup: $dir"
                rm -rf "$dir"
              fi
            done
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "No backup changes to commit."
          else
            DATE="${{ steps.prep.outputs.date }}"
            git commit -m "chore(backup): daily snapshot $DATE"
            git push
          fi
