name: Convert APP.xlsx to JSON

on:
  push:
    branches: [ main ]
    paths:
      - 'APP.xlsx'
  schedule:
    # safety net: كل 15 دقيقة يشغل حتى لو حد نسي push
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# لو جات push جديدة قبل ما السابقة تخلص، نلغي القديمة ونبدأ الجديدة
concurrency:
  group: convert-xlsx
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # ناخد آخر commit بس (أسرع)
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # cache لـ pip عشان ما يعيد تحميل openpyxl كل مرة
          
      - name: Install dependencies
        run: pip install openpyxl

      - name: Convert Excel to JSON
        run: python scripts/xlsx_to_json.py APP.xlsx .

      - name: Commit and push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # لو ملف من قايمة add مش موجود (مثلاً أول مرة لـ checksAgainstUs.json)، كمّل من غير فشل
          for f in checks.json checksAgainstUs.json parties.json salaries.json overdue.json lastPrices.json allSales.json installments.json dataUpdatedAt.json; do
            [ -f "$f" ] && git add "$f" || echo "skip missing $f"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto-update JSON from APP.xlsx [skip ci]"
          # retry push مع pull --rebase لو حصل اصطدام مع commit من workflow موازي
          for i in 1 2 3; do
            if git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push attempt $i failed — pulling and retrying"
            git pull --rebase origin main || true
            sleep 2
          done
          echo "push failed after 3 attempts" >&2
          exit 1
