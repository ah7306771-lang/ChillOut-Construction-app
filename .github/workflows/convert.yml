name: Convert APP.xlsx to JSON

on:
  push:
    branches: [ main ]
    paths:
      - 'APP.xlsx'
  schedule:
    # safety net: كل 15 دقيقة يشغل حتى لو حد نسي push
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# لو جات push جديدة قبل ما السابقة تخلص، نلغي القديمة ونبدأ الجديدة
concurrency:
  group: convert-xlsx
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # ناخد آخر commit بس (أسرع)
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # cache لـ pip عشان ما يعيد تحميل openpyxl كل مرة
          cache: 'pip'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Convert Excel to JSON
        run: python scripts/xlsx_to_json.py APP.xlsx .

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checks.json parties.json salaries.json overdue.json lastPrices.json allSales.json installments.json dataUpdatedAt.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update JSON from APP.xlsx [skip ci]"
            git push
          fi
